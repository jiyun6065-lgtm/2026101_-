<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeneScope Performance - 주요 희귀 유전질환 데이터베이스</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(21, 29, 46, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(56, 189, 248, 0.4);
      --accent-blue: #38bdf8;
      --accent-purple: #c084fc;
      --accent-green: #34d399;
      --accent-amber: #fbbf24;
      --accent-red: #f87171;
      --text-main: #f1f5f9;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 80px; }

    /* GNB 상단 네비게이션 */
    .gnb {
      width: 100%; background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(16px); position: sticky; top: 0; z-index: 200;
      border-bottom: 1px solid var(--card-border); display: flex; justify-content: center;
    }
    .gnb-container {
      width: 100%; max-width: 1240px; padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .gnb-logo { font-size: 1.2rem; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 10px; text-decoration: none; letter-spacing: -0.5px; }
    .gnb-logo i { color: var(--accent-blue); font-size: 1.35rem; }
    .gnb-menu { display: flex; gap: 24px; align-items: center; }
    .gnb-item { color: var(--text-sub); text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: color 0.2s; }
    .gnb-item:hover { color: var(--accent-blue); }

    /* 메인 컨테이너 */
    main { width: 100%; max-width: 1240px; padding: 36px 24px; }
    
    .dashboard-header { margin-bottom: 32px; }
    .dashboard-header h1 { font-size: 1.85rem; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; margin-bottom: 8px; }
    .dashboard-header p { font-size: 0.98rem; color: var(--text-sub); line-height: 1.5; }

    /* 검색창 영역 */
    .search-box { position: relative; margin-bottom: 28px; }
    .search-input {
      width: 100%; padding: 18px 24px 18px 56px; background: rgba(21, 29, 46, 0.85);
      border: 1px solid var(--card-border); border-radius: 16px; color: #fff; font-size: 1rem; outline: none;
      transition: all 0.25s; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }
    .search-input:focus { border-color: var(--accent-blue); box-shadow: 0 0 20px rgba(56, 189, 248, 0.25); background: rgba(21, 29, 46, 0.95); }
    .search-icon { position: absolute; left: 22px; top: 50%; transform: translateY(-50%); color: var(--accent-blue); font-size: 1.25rem; }

    /* 질환 선택 탭 */
    .disease-selector { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 32px; scrollbar-width: none; }
    .disease-selector::-webkit-scrollbar { display: none; }
    .chip {
      padding: 12px 24px; background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 30px; color: var(--text-sub); font-size: 0.95rem; font-weight: 600; white-space: nowrap; cursor: pointer; transition: all 0.25s;
    }
    .chip:hover { border-color: var(--accent-blue); color: #fff; }
    .chip.active { background: linear-gradient(135deg, #0284c7, #9333ea); color: #fff; border-color: transparent; box-shadow: 0 4px 16px rgba(147, 51, 234, 0.35); }

    /* Grid 카드 레이아웃 */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }

    /* 카드 스타일 */
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 26px; display: flex; flex-direction: column; justify-content: flex-start; backdrop-filter: blur(8px); transition: border-color 0.2s; }
    .card:hover { border-color: var(--card-hover-border); }
    .card.full-width { grid-column: 1 / -1; }
    
    .card-title { font-size: 0.88rem; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase; color: var(--accent-blue); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    
    .keyword-badge {
      display: inline-block; background: rgba(56, 189, 248, 0.12); color: #7dd3fc;
      padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 1.02rem; margin-bottom: 14px; border-left: 4px solid var(--accent-blue);
      line-height: 1.4;
    }
    
    .card-content { font-size: 0.96rem; line-height: 1.75; color: var(--text-main); white-space: pre-line; word-break: keep-all; }

    /* DNA 시뮬레이터 전용 스타일 */
    .dna-sim-card { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 18px; padding: 28px; margin-bottom: 24px; }
    .dna-block-container { display: flex; flex-wrap: wrap; gap: 8px; font-family: monospace; font-size: 0.95rem; margin-top: 10px; }
    .codon-box { background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); padding: 8px 12px; border-radius: 8px; text-align: center; }
    .codon-box.mutated { background: rgba(248, 113, 113, 0.2); border-color: var(--accent-red); }
    .seq-dna { font-weight: bold; color: var(--accent-blue); font-size: 1.05rem; letter-spacing: 1px; }
    .seq-mrna { color: var(--accent-purple); font-size: 0.9rem; }
    .seq-aa { color: var(--accent-green); font-size: 0.85rem; font-weight: bold; margin-top: 4px; }
    .seq-aa.stop { color: var(--accent-red); }

    /* 출처 카드 */
    .source-card {
      grid-column: 1 / -1; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(251, 191, 36, 0.3); border-radius: 18px; padding: 26px; margin-top: 8px;
    }
    .source-title { font-size: 0.95rem; font-weight: 700; color: var(--accent-amber); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .source-list { list-style: none; padding-left: 0; }
    .source-list li { font-size: 0.92rem; color: #cbd5e1; margin-bottom: 12px; line-height: 1.6; display: flex; align-items: flex-start; gap: 10px; }
    .source-list li i { color: var(--accent-amber); margin-top: 4px; font-size: 0.85rem; }
    .source-link { color: var(--accent-blue); text-decoration: none; word-break: break-all; font-weight: 500; }
    .source-link:hover { text-decoration: underline; }

    /* 상세 종합 분석표 스타일 */
    .compare-container { overflow-x: auto; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 18px; padding: 28px; }
    .compare-header { margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: var(--accent-green); }
    .compare-header h3 { font-size: 1.2rem; font-weight: 700; }
    
    .compare-table { width: 100%; border-collapse: collapse; min-width: 950px; font-size: 0.9rem; }
    .compare-table th { background: rgba(56, 189, 248, 0.12); color: var(--accent-blue); padding: 14px; text-align: left; border-bottom: 2px solid var(--card-border); font-size: 0.92rem; font-weight: 700; white-space: nowrap; }
    .compare-table td { padding: 16px 14px; border-bottom: 1px solid var(--card-border); line-height: 1.65; vertical-align: top; }
    .compare-table tr:hover td { background: rgba(255, 255, 255, 0.02); }

    /* 하이라이트 효과 */
    .highlight { background-color: rgba(250, 204, 21, 0.35); color: #fef08a; border-radius: 3px; padding: 2px 4px; font-weight: 600; }

    /* 퀴즈 영역 */
    .quiz-card { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(192, 132, 252, 0.3); border-radius: 18px; padding: 28px; margin-top: 32px; }
    .quiz-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
    .quiz-item { background: rgba(21, 29, 46, 0.6); padding: 22px; border-radius: 14px; border: 1px solid var(--card-border); }
    .quiz-q { font-weight: 700; font-size: 0.98rem; margin-bottom: 14px; color: #fff; line-height: 1.5; }
    .quiz-btn { width: 100%; padding: 12px 16px; margin-top: 8px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border); border-radius: 10px; color: var(--text-main); text-align: left; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; line-height: 1.4; }
    .quiz-btn:hover { background: rgba(56, 189, 248, 0.15); border-color: var(--accent-blue); color: #fff; }
    .result-box { margin-top: 12px; padding: 12px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; display: none; line-height: 1.5; }

    footer { width: 100%; max-width: 1240px; text-align: center; padding: 32px 24px; color: var(--text-muted); font-size: 0.88rem; margin-top: 20px; }
  </style>
</head>
<body>

  <!-- 상단 GNB -->
  <nav class="gnb">
    <div class="gnb-container">
      <a href="#" class="gnb-logo">
        <i class="fa-solid fa-dna"></i> GENESCOPE PERFORMANCE
      </a>
      <div class="gnb-menu">
        <a href="#main-content" class="gnb-item">질환 데이터베이스</a>
        <a href="#quiz-section" class="gnb-item">개념 검증 퀴즈</a>
        <a href="https://helpline.kdca.go.kr" target="_blank" class="gnb-item" style="color: var(--accent-blue);"><i class="fa-solid fa-arrow-up-right-from-square"></i> 희귀질환헬프라인</a>
      </div>
    </div>
  </nav>

  <main>
    <!-- 대시보드 헤더 -->
    <div class="dashboard-header">
      <h1>희귀 유전질환 종합 탐구 대시보드</h1>
      <p>단일 유전자 및 염색체 이상 질환의 원인, 유전 방식, DNA 시뮬레이션, 임상 소견 데이터베이스</p>
    </div>

    <!-- 실시간 통합 검색창 -->
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="유전자명, 증상, 유전방식, 키워드 실시간 검색 (예: FBN1, 체리색, 우성, 22q11)..." oninput="handleSearch()">
    </div>

    <!-- 질환 선택 탭 메뉴 -->
    <div class="disease-selector">
      <div class="chip active" onclick="switchTab('taysachs', this)">테이 삭스병</div>
      <div class="chip" onclick="switchTab('marfan', this)">마르판 증후군</div>
      <div class="chip" onclick="switchTab('duchenne', this)">뒤센 근이영양증</div>
      <div class="chip" onclick="switchTab('diGeorge', this)">22q11.2 결실 증후군</div>
      <div class="chip" style="border-color: var(--accent-green); color: var(--accent-green);" onclick="switchTab('compare', this)">
        <i class="fa-solid fa-table"></i> 상세 종합 분석표
      </div>
    </div>

    <!-- 메인 콘텐츠 영역 -->
    <div id="main-content"></div>

    <!-- 퀴즈 영역 -->
    <div class="quiz-card" id="quiz-section">
      <div class="card-title" style="color: var(--accent-purple); font-size: 1rem;">
        <i class="fa-solid fa-gamepad"></i> 상호작용 개념 검증 퀴즈 (5문항)
      </div>
      <div id="quiz-container" class="quiz-grid"></div>
    </div>
  </main>

  <footer>
    <p>GeneScope Performance App - 생명과학 유전 탐구 보고서 웹 대시보드</p>
  </footer>

  <script>
    // 코돈 번역 매핑 테이블 (Central Dogma)
    const codonTable = {
      'AUG': 'Met (시작)', 'UAC': 'Tyr', 'UUU': 'Phe', 'UUC': 'Phe',
      'TATC': 'TATC(변이)', 'UAA': 'STOP (종결)', 'UAG': 'STOP (종결)', 'UGA': 'STOP (종결)',
      'GAC': 'Asp', 'GUC': 'Val', 'GGU': 'Gly', 'GGC': 'Gly', 'GAG': 'Glu',
      'CCC': 'Pro', 'CCU': 'Pro', 'AAG': 'Lys', 'AGA': 'Arg', 'CUG': 'Leu'
    };

    const diseases = {
      taysachs: {
        title: "테이 삭스병 (Tay-Sachs Disease)",
        dnaSeq: {
          normal: ["ATG", "GAC", "UAC", "UUC", "GAG"],
          mutated: ["ATG", "GAC", "TATC", "UAC", "UUC"], // 4bp 서열 삽입 (TATC)
          desc: "HEXA 유전자 11번 엑손의 4bp (TATC) 프레임시프트 삽입 변이 시뮬레이션입니다.\n변이 이후 읽기 틀이 바뀌면서 즉시 조기 종결 코돈이 생성되어 Hexosaminidase A 효소 합성이 중단됩니다."
        },
        cause: {
          kw: "15번 염색체 HEXA 유전자 변이 / Hexosaminidase A 효소 결핍",
          desc: "15번 염색체(15q23)에 위치한 HEXA 유전자의 돌연변이로 인해 지질 분해 효소인 Hexosaminidase A가 정상적으로 형성되지 않거나 기능이 마비됩니다.\n\n결과적으로 리소좀 내 지질 성분인 'GM2 갱글리오사이드'가 분해되지 못하고 뇌 및 척수의 신경 세포에 과도하게 축적되어 급성 신경계 퇴행을 유발합니다."
        },
        inheritance: {
          kw: "상염색체 열성 유전 (Autosomal Recessive)",
          desc: "단일 유전자 유전 중 상염색체 열성 방식을 따릅니다.\n\n• 양쪽 부모가 모두 보균자(Tt)일 경우 자녀의 발병 확률은 25%(tt)입니다.\n• 자녀가 보균자일 확률은 50%(Tt), 정상 유전자를 가질 확률은 25%(TT)입니다."
        },
        symptoms: {
          kw: "망막 체리색 반점 / 신경계 급격한 퇴행 / 소리 과민 반응",
          desc: "• 영아형: 생후 3~6개월부터 소리에 대한 과민 반응(Startle response)으로 시작되어 점차 근력이 약화됩니다. 안과 검진 시 망막 중심부에 '체리색 반점(Cherry-red spot)'이 관찰되며 발작, 마비, 실명, 지능 저하로 이어집니다.\n\n• 유소년/성인형: 발병 시기가 늦으며 운동 조절 장애 및 정신과적 증상이 나타납니다."
        },
        diagnosis: {
          kw: "효소 활성도 측정 / 유전자 검사 / 산전 검사",
          desc: "• 혈액 검사: 백혈구나 혈청 내 Hexosaminidase A 효소의 활성도가 현저히 감소했는지 측정합니다.\n• 유전자 검사: HEXA 유전자의 돌연변이 여부를 분자유전학적으로 확진합니다.\n• 산전 진단: 가족력이 있는 경우 양수 검사나 융모막 생검을 통해 태아의 유전자 이상 여부를 검사합니다."
        },
        management: {
          kw: "증상 완화 중심의 보존적 치료 / 다학제적 관리",
          desc: "현재 신경 퇴행을 완치하거나 중단시키는 근본적인 치료제는 존재하지 않습니다.\n\n• 발작 제어를 위한 항경련제 투여\n• 영양 공급을 위한 튜브 관급 및 기도 유지 지원\n• 관절 수축 방지를 위한 물리 치료 및 재활 지원"
        },
        sources: [
          { name: "질병관리청 희귀질환헬프라인 - 테이삭스병", url: "https://helpline.kdca.go.kr" },
          { name: "MedlinePlus Genetics - Tay-Sachs disease (NIH National Library of Medicine)", url: "https://medlineplus.gov/genetics/condition/tay-sachs-disease/" },
          { name: "GeneReviews® - HEXA Disorders (Kaback MM, Desnick RJ)", url: "https://www.ncbi.nlm.nih.gov/books/NBK1218/" }
        ],
        quizzes: [
          { q: "1. 테이 삭스병의 원인 유전자와 결핍 효소는?", options: ["FBN1 / 피브릴린-1", "HEXA / Hexosaminidase A", "DMD / 디스트로핀", "CFTR / 염소통로"], ans: 1, exp: "15번 염색체 HEXA 유전자 변이로 Hexosaminidase A 효소가 결핍됩니다." },
          { q: "2. 테이 삭스병의 유전 방식은?", options: ["상염색체 우성", "반성 열성", "상염색체 열성", "성염색체 우성"], ans: 2, exp: "상염색체 열성 유전으로, 열성 동형접합(tt)일 때 발현됩니다." },
          { q: "3. 영아형 테이 삭스병의 대표적인 안과적 특징은?", options: ["수정체 탈구", "망막 체리색 반점", "백내장", "황반변성"], ans: 1, exp: "망막 중심부에 체리색 반점(Cherry-red spot)이 특징적으로 관찰됩니다." },
          { q: "4. 보균자(Tt) 부모 사이에서 자녀 발병 확률은?", options: ["0%", "25%", "50%", "75%"], ans: 1, exp: "보균자 부모 임신 시 자녀 발병(tt) 확률은 25%입니다." },
          { q: "5. 테이 삭스병의 현재 치료 방향은?", options: ["단번에 완전 완치", "완치제가 없어 보존적(증상 완화) 치료 시행", "약물로 효소 완전 복구", "치료 불필요"], ans: 1, exp: "완치법이 없으므로 항경련제, 물리치료 등 지원적 관리를 시행합니다." }
        ]
      },
      marfan: {
        title: "마르판 증후군 (Marfan Syndrome)",
        dnaSeq: {
          normal: ["ATG", "UAC", "GAC", "GGU", "GAG"],
          mutated: ["ATG", "UAC", "UAA", "GGU", "GAG"], // 과미스변이 / 과오변이 (GAC -> UAA 종결변이)
          desc: "FBN1 유전자 점돌연변이(Nonsense Mutation) 시뮬레이션입니다.\n단 하나의 염기 치환으로 정상 아미노산(Asp) 대신 종결 코돈(UAA)이 형성되어 불완전한 단백질이 만들어집니다."
        },

    function applyHighlight(text, query) {
      if (!query) return text;
      const escapedQuery = query.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
      const re = new RegExp(`(${escapedQuery})`, 'gi');
      return text.replace(re, '<span class="highlight">$1</span>');
    }

    // 1번: DNA 시뮬레이터 HTML 생성기
    function renderDnaSimulator(dnaData) {
      const renderCodons = (list, isMutated = false) => {
        return list.map(c => {
          const aa = codonTable[c] || (c === '---' ? '손실됨' : '아미노산');
          const isStop = aa.includes('STOP');
          return `
            <div class="codon-box ${isMutated ? 'mutated' : ''}">
              <div class="seq-dna">${c}</div>
              <div class="seq-aa ${isStop ? 'stop' : ''}">${aa}</div>
            </div>
          `;
        }).join('');
      };

      return `
        <div class="dna-sim-card full-width">
          <div class="card-title" style="color: var(--accent-blue);">
            <i class="fa-solid fa-code-branch"></i> [분자생물학 시뮬레이션] 유전자 서열 및 번역(Central Dogma) 비교
          </div>
          <p style="font-size: 0.9rem; color: var(--text-sub); margin-bottom: 16px;">${dnaData.desc}</p>
          
          <div style="margin-bottom: 16px;">
            <span style="font-size: 0.88rem; font-weight:700; color:var(--accent-green);">■ 정상 유전자 서열 (Normal DNA Sequence)</span>
            <div class="dna-block-container">${renderCodons(dnaData.normal, false)}</div>
          </div>

          <div>
            <span style="font-size: 0.88rem; font-weight:700; color:var(--accent-red);">■ 변이 유전자 서열 (Mutated Sequence)</span>
            <div class="dna-block-container">${renderCodons(dnaData.mutated, true)}</div>
          </div>
        </div>
      `;
    }

    // 상세 분석 비교표 렌더링
    function renderCompareTable(keyword = '') {
      const compareData = [
        {
          name: "테이 삭스병",
          gene: "15번 염색체 (HEXA)",
          inheritance: "상염색체 열성<br>(부모 보균 시 자녀 25%)",
          patho: "Hexosaminidase A 결핍으로 GM2 갱글리오사이드 리소좀 축적",
          symptoms: "망막 체리색 반점, 신경계 퇴행, 소리 과민 반응, 마비",
          diagnosis: "혈청 효소 활성도 측정,<br>HEXA 유전자 검사",
          treatment: "완치제 없음, 항경련제,<br>튜브 관급 등 보존적 관리"
        },
        {
          name: "마르판 증후군",
          gene: "15번 염색체 (FBN1)",
          inheritance: "상염색체 우성<br>(자녀 50%, de novo 25%)",
          patho: "피브릴린-1 단백질 이상으로 결합조직 탄성 약화 및 TGF-β 과활성",
          symptoms: "큰 키, 긴 팔다리/손가락, 수정체 탈구, 대동맥 근부 확장/박리",
          diagnosis: "Ghent 임상 진단 기준,<br>심초음파, FBN1 유전자 검사",
          treatment: "베타차단제/ARB 약물,<br>예방적 대동맥 교정 수술"
        },
        {
          name: "뒤센 근이영양증",
          gene: "X 염색체 (DMD)",
          inheritance: "X 염색체 연관 열성<br>(주로 남성 발병)",
          patho: "디스트로핀 단백질 결핍으로 운동 시 근육 세포막 파괴 및 괴사",
          symptoms: "가버스 징후, 종아리 가성비대, 근위부 근육 약화, 심근병증",
          diagnosis: "혈청 CK 수치 측정(수십 배 상승),<br>DMD 유전자 검사, 근생검",
          treatment: "스테로이드 제제 투여,<br>엑손 건너뛰기 치료, 호흡 재활"
        },
        {
          name: "22q11.2 결실 증후군",
          gene: "22번 염색체 (22q11.2 결실)",
          inheritance: "상염색체 우성<br>(de novo 신규 변이 90%)",
          patho: "22q11.2 부위 미세결실로 배아 인두낭 발달 장애 (TBX1 등 손실)",
          symptoms: "선천성 심장 기형, 구개열, 부갑상선 저하로 저칼슘혈증, T세포 면역 결핍",
          diagnosis: "FISH 검사,<br>염색체 마이크로어레이(CMA)",
          treatment: "심장/구개열 교정 수술,<br>칼슘/비타민D 보충, 언어 재활"
        }
      ];

      const filteredData = compareData.filter(item => {
        if (!keyword) return true;
        const allText = (item.name + item.gene + item.inheritance + item.patho + item.symptoms + item.diagnosis + item.treatment).toLowerCase();
        return allText.includes(keyword.toLowerCase());
      });

      let rowsHTML = filteredData.map(item => `
        <tr>
          <td style="font-weight:bold; color:var(--accent-blue); white-space:nowrap;">${applyHighlight(item.name, keyword)}</td>
          <td style="font-weight:600;">${applyHighlight(item.gene, keyword)}</td>
          <td>${applyHighlight(item.inheritance, keyword)}</td>
          <td>${applyHighlight(item.patho, keyword)}</td>
          <td>${applyHighlight(item.symptoms, keyword)}</td>
          <td>${applyHighlight(item.diagnosis, keyword)}</td>
          <td>${applyHighlight(item.treatment, keyword)}</td>
        </tr>
      `).join('');

      if (filteredData.length === 0) {
        rowsHTML = `<tr><td colspan="7" style="text-align:center; padding: 32px; color:var(--text-sub);">검색어 "<strong>${keyword}</strong>"에 일치하는 비교 분석 결과가 없습니다.</td></tr>`;
      }

      return `
        <div class="compare-container">
          <div class="compare-header">
            <i class="fa-solid fa-chart-line" style="font-size:1.3rem;"></i>
            <h3>4대 희귀 유전질환 상세 심층 분석표</h3>
          </div>
          <table class="compare-table">
            <thead>
              <tr>
                <th style="width: 10%;">질환명</th>
                <th style="width: 13%;">원인 유전자/염색체</th>
                <th style="width: 13%;">유전 방식 및 확률</th>
                <th style="width: 20%;">병태생리 및 발병 기전</th>
                <th style="width: 20%;">대표 임상 증상</th>
                <th style="width: 12%;">핵심 진단 기법</th>
                <th style="width: 12%;">치료 및 관리 전략</th>
              </tr>
            </thead>
            <tbody>
              ${rowsHTML}
            </tbody>
          </table>
        </div>
      `;
    }

    // 탭 및 메인 콘텐츠 렌더링
    function renderTab(key, keyword = '') {
      currentTab = key;
      const mainDiv = document.getElementById('main-content');
      const quizSection = document.getElementById('quiz-section');

      if (key === 'compare') {
        quizSection.style.display = 'none';
        mainDiv.innerHTML = renderCompareTable(keyword);
        return;
      }

      quizSection.style.display = 'block';
      const data = diseases[key];

      const sections = [
        { title: "1. 유전적 원인", icon: "fa-dna", data: data.cause },
        { title: "2. 유전 방식", icon: "fa-sitemap", data: data.inheritance },
        { title: "3. 주요 증상 및 특징", icon: "fa-stethoscope", data: data.symptoms },
        { title: "4. 진단 방법", icon: "fa-microscope", data: data.diagnosis },
        { title: "5. 치료 및 관리 방법", icon: "fa-kit-medical", data: data.management }
      ];

      let dnaSimHTML = renderDnaSimulator(data.dnaSeq);

      let gridCardsHTML = sections.map(sec => `
        <div class="card">
          <div class="card-title"><i class="fa-solid ${sec.icon}"></i> ${sec.title}</div>
          <div class="keyword-badge">${applyHighlight(sec.data.kw, keyword)}</div>
          <div class="card-content">${applyHighlight(sec.data.desc, keyword)}</div>
        </div>
      `).join('');

      let sourcesHTML = `
        <div class="source-card">
          <div class="source-title"><i class="fa-solid fa-book-bookmark"></i> [검증된 출처 및 참고 문헌 서지 정보]</div>
          <ul class="source-list">
            ${data.sources.map(s => `
              <li>
                <i class="fa-solid fa-link"></i>
                <span><strong>${s.name}</strong> - <a href="${s.url}" target="_blank" class="source-link">${s.url}</a></span>
              </li>
            `).join('')}
          </ul>
        </div>
      `;

      mainDiv.innerHTML = `
        <div class="card full-width" style="margin-bottom: 24px; border-left: 5px solid var(--accent-blue);">
          <div class="card-title" style="margin-bottom:6px;"><i class="fa-solid fa-disease"></i> 탐구 대상 질환</div>
          <div class="card-content" style="font-weight:800; font-size:1.4rem; color: #ffffff;">${applyHighlight(data.title, keyword)}</div>
        </div>
        ${dnaSimHTML}
        <div class="grid-container">
          ${gridCardsHTML}
          ${sourcesHTML}
        </div>
      `;

      // 퀴즈 항목 렌더링
      const quizDiv = document.getElementById('quiz-container');
      quizDiv.innerHTML = data.quizzes.map((q, qIdx) => `
        <div class="quiz-item">
          <div class="quiz-q">${q.q}</div>
          ${q.options.map((opt, oIdx) => `
            <button class="quiz-btn" onclick="checkAnswer(${qIdx},${oIdx}, ${q.ans}, '${encodeURIComponent(q.exp)}')">
              ${oIdx + 1}.${opt}
            </button>
          `).join('')}
          <div id="q-res-${qIdx}" class="result-box"></div>
        </div>
      `).join('');
    }

    // 탭 전환
    function switchTab(key, el) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      const query = document.getElementById('searchInput').value.trim();
      renderTab(key, query);
    }

    // 실시간 검색
    function handleSearch() {
      const query = document.getElementById('searchInput').value.trim();
      renderTab(currentTab, query);
    }

    // 퀴즈 답안 검증
    function checkAnswer(qIdx, selected, correct, exp) {
      const resBox = document.getElementById(`q-res-${qIdx}`);
      const decodedExp = decodeURIComponent(exp);
      resBox.style.display = "block";

      if (selected === correct) {
        resBox.style.background = "rgba(34, 197, 94, 0.18)";
        resBox.style.color = "#4ade80";
        resBox.style.border = "1px solid rgba(34, 197, 94, 0.4)";
        resBox.innerHTML = `⭕ 정답입니다!<br><span style="font-weight:normal; font-size:0.85rem; color:#cbd5e1;">💡 해설: ${decodedExp}</span>`;
      } else {
        resBox.style.background = "rgba(239, 68, 68, 0.18)";
        resBox.style.color = "#f87171";
        resBox.style.border = "1px solid rgba(239, 68, 68, 0.4)";
        resBox.innerText = "❌ 오답입니다. 다시 시도해보세요!";
      }
    }

    // 초기화
    renderTab('taysachs');
  </script>
</body>
</html>
