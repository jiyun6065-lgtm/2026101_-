<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>유전병 탐구 대시보드 - 주요 희귀 유전질환 데이터베이스</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent-blue: #38bdf8;
      --accent-purple: #a855f7;
      --accent-green: #34d399;
      --accent-amber: #fbbf24;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 80px; }

    /* 화면 폭 확장: 기존 850px -> 1200px로 변경하여 좌우 여백 개선 */
    header {
      width: 100%; max-width: 1200px; padding: 24px 20px; background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--card-border);
      display: flex; justify-content: space-between; align-items: center;
    }

    .title-group h1 { font-size: 1.4rem; font-weight: 800; color: var(--accent-blue); display: flex; align-items: center; gap: 10px; }
    .title-group p { font-size: 0.82rem; color: var(--text-sub); margin-top: 4px; }

    main { width: 100%; max-width: 1200px; padding: 24px 20px; }

    /* 검색창 */
    .search-box { position: relative; margin-bottom: 24px; }
    .search-input {
      width: 100%; padding: 14px 18px 14px 48px; background: rgba(30, 41, 59, 0.9);
      border: 1px solid var(--card-border); border-radius: 12px; color: var(--text-main); font-size: 0.95rem; outline: none;
      transition: all 0.2s;
    }
    .search-input:focus { border-color: var(--accent-blue); box-shadow: 0 0 12px rgba(56, 189, 248, 0.2); }
    .search-icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--accent-blue); font-size: 1.1rem; }

    /* 탭 메뉴 */
    .disease-selector { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 24px; scrollbar-width: none; }
    .disease-selector::-webkit-scrollbar { display: none; }
    .chip {
      padding: 10px 18px; background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 20px; color: var(--text-sub); font-size: 0.9rem; font-weight: 600; white-space: nowrap; cursor: pointer; transition: all 0.2s;
    }
    .chip:hover { border-color: var(--accent-blue); color: var(--text-main); }
    .chip.active { background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); color: #fff; border-color: transparent; }

    /* 반응형 Grid 레이아웃: 화면 크기에 맞춰 카드 배치 */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }

    /* 카드 스타일 */
    .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; justify-content: flex-start; }
    .card.full-width { grid-column: 1 / -1; }
    .card-title { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: var(--accent-blue); margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    
    /* 핵심 키워드 강조 */
    .keyword-badge {
      display: inline-block; background: rgba(56, 189, 248, 0.15); color: var(--accent-blue);
      padding: 4px 10px; border-radius: 6px; font-weight: bold; font-size: 0.95rem; margin-bottom: 8px; border-left: 3px solid var(--accent-blue);
    }
    .card-content { font-size: 0.92rem; line-height: 1.65; color: var(--text-main); white-space: pre-line; }

    /* 출처 전용 박스 */
    .source-card {
      grid-column: 1 / -1; background: rgba(15, 23, 42, 0.9); border: 1px solid var(--accent-amber); border-radius: 14px; padding: 20px; margin-top: 10px;
    }
    .source-title { font-size: 0.9rem; font-weight: bold; color: var(--accent-amber); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .source-list { list-style: none; padding-left: 0; }
    .source-list li { font-size: 0.88rem; color: #cbd5e1; margin-bottom: 8px; line-height: 1.5; display: flex; align-items: flex-start; gap: 8px; }
    .source-list li i { color: var(--accent-amber); margin-top: 4px; font-size: 0.8rem; }
    .source-link { color: var(--accent-blue); text-decoration: none; word-break: break-all; }
    .source-link:hover { text-decoration: underline; }

    /* 비교표 스타일 */
    .compare-container { overflow-x: auto; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 14px; padding: 20px; }
    .compare-table { width: 100%; border-collapse: collapse; min-width: 700px; font-size: 0.88rem; }
    .compare-table th { background: rgba(56, 189, 248, 0.15); color: var(--accent-blue); padding: 12px; text-align: left; border-bottom: 1px solid var(--card-border); }
    .compare-table td { padding: 12px; border-bottom: 1px solid var(--card-border); line-height: 1.5; vertical-align: top; }

    /* 하이라이트 */
    .highlight { background-color: rgba(250, 204, 21, 0.35); color: #fef08a; border-radius: 2px; padding: 0 2px; }

    /* 퀴즈 */
    .quiz-card { background: rgba(15, 23, 42, 0.9); border: 1px solid var(--accent-purple); border-radius: 14px; padding: 22px; margin-top: 24px; }
    .quiz-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 14px; }
    .quiz-item { background: rgba(30, 41, 59, 0.5); padding: 16px; border-radius: 10px; border: 1px solid var(--card-border); }
    .quiz-q { font-weight: 600; font-size: 0.92rem; margin-bottom: 10px; color: #f1f5f9; }
    .quiz-btn { width: 100%; padding: 10px 12px; margin-top: 6px; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--card-border); border-radius: 6px; color: var(--text-main); text-align: left; font-size: 0.88rem; cursor: pointer; transition: all 0.2s; }
    .quiz-btn:hover { background: rgba(56, 189, 248, 0.15); border-color: var(--accent-blue); }
    .result-box { margin-top: 8px; padding: 10px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; display: none; line-height: 1.4; }

    footer { width: 100%; max-width: 1200px; text-align: center; padding: 24px; color: var(--text-sub); font-size: 0.82rem; }
  </style>
</head>
<body>

  <header>
    <div class="title-group">
      <h1><i class="fa-solid fa-dna"></i> 유전병 탐구 대시보드</h1>
      <p>주요 희귀 유전질환 체계적 조사 및 출처 검증 정보 웹앱</p>
    </div>
  </header>

  <main>
    <!-- 검색창 -->
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass search-icon"></i>
      <input type="text" id="searchInput" class="search-input" placeholder="유전자명, 증상, 유전방식, 키워드 검색 (예: FBN1, 체리색, 우성)..." onkeyup="handleSearch()">
    </div>

    <!-- 네비게이션 탭 -->
    <div class="disease-selector">
      <div class="chip active" onclick="switchTab('taysachs', this)">테이 삭스병</div>
      <div class="chip" onclick="switchTab('marfan', this)">마르판 증후군</div>
      <div class="chip" onclick="switchTab('duchenne', this)">뒤센 근이영양증</div>
      <div class="chip" onclick="switchTab('diGeorge', this)">22q11.2 결실</div>
      <div class="chip" style="border-color: var(--accent-green); color: var(--accent-green);" onclick="switchTab('compare', this)">
        <i class="fa-solid fa-table"></i> 질환 종합 비교표
      </div>
    </div>

    <!-- 메인 콘텐츠 영역 -->
    <div id="main-content"></div>

    <!-- 퀴즈 영역 -->
    <div class="quiz-card" id="quiz-section">
      <div class="card-title" style="color: var(--accent-purple); font-size: 1rem;">
        <i class="fa-solid fa-gamepad"></i> 상호작용 개념 검증 퀴즈 (5문항)
      </div>
      <div id="quiz-container" class="quiz-grid"></div>
    </div>
  </main>

  <footer>
    <p>생물의 유전 수행평가 탐구 보고서 웹앱</p>
  </footer>

  <script>
    const diseases = {
      taysachs: {
        title: "테이 삭스병 (Tay-Sachs Disease)",
        cause: {
          kw: "15번 염색체 HEXA 유전자 변이 / Hexosaminidase A 효소 결핍",
          desc: "15번 염색체(15q23)에 위치한 HEXA 유전자의 돌연변이로 인해 지질 분해 효소인 Hexosaminidase A가 제대로 생성되지 않거나 기능이 마비됩니다. 이로 인해 'GM2 갱글리오사이드'라는 지질 성분이 뇌와 척수의 신경 세포 내 지질소체에 과도하게 축적되어 세포 손상 및 신경계 퇴행을 일으킵니다."
        },
        inheritance: {
          kw: "상염색체 열성 유전 (Autosomal Recessive)",
          desc: "단일 유전자 유전 중 상염색체 열성 방식을 따릅니다.\n• 양쪽 부모가 모두 보균자(Tt)일 경우 자녀에게 발병할 확률은 25%(tt)입니다.\n• 보균자일 확률은 50%(Tt), 정상일 확률은 25%(TT)가 됩니다."
        },
        symptoms: {
          kw: "망막 체리색 반점 / 신경계 급격한 퇴행 / 근력 저하",
          desc: "• 영아형: 생후 3~6개월부터 시작되며 초기에는 소리에 과민 반응을 보이고 점차 근력이 약화됩니다. 안과적 검사 시 망막 중심부에 '체리색 반점(Cherry-red spot)'이 관찰되며 발작, 마비, 지능 저하로 이어집니다.\n• 유소년/성인형: 발병 시기가 늦으며 운동 조절 장애 및 정신과적 증상이 나타납니다."
        },
        diagnosis: {
          kw: "효소 활성도 측정 / 유전자 검사 / 산전 검사",
          desc: "• 혈액 검사: 백혈구나 혈청 내 Hexosaminidase A 효소의 활성도가 현저히 감소했는지 측정합니다.\n• 유전자 검사: HEXA 유전자의 돌연변이 여부를 분자유전학적으로 확진합니다.\n• 산전 진단: 가족력이 있는 경우 양수 검사나 융모막 생검을 통해 태아의 이상 여부를 확인합니다."
        },
        management: {
          kw: "증상 완화 중심의 보존적 치료 / 다학제적 관리",
          desc: "현재 신경 퇴행을 완전 완치하거나 중단시키는 근본적인 치료제는 존재하지 않습니다.\n• 발작 완화를 위한 항경련제 투여\n• 영양 공급을 위한 튜브 관급\n• 관절 수축 방지를 위한 물리 치료 및 관절 운동 지원"
        },
        sources: [
          { name: "질병관리청 희귀질환헬프라인 - 테이삭스병", url: "https://helpline.kdca.go.kr" },
          { name: "MedlinePlus Genetics - Tay-Sachs disease (NIH National Library of Medicine)", url: "https://medlineplus.gov/genetics/condition/tay-sachs-disease/" },
          { name: "GeneReviews® - HEXA Disorders (Kaback MM, Desnick RJ)", url: "https://www.ncbi.nlm.nih.gov/books/NBK1218/" }
        ],
        quizzes: [
          { q: "1. 테이 삭스병의 원인 유전자와 결핍 효소는?", options: ["FBN1 / 피브릴린-1", "HEXA / Hexosaminidase A", "DMD / 디스트로핀", "CFTR / 염소통로"], ans: 1, exp: "15번 염색체 HEXA 유전자 변이로 Hexosaminidase A 효소가 결핍됩니다." },
          { q: "2. 테이 삭스병의 유전 방식은?", options: ["상염색체 우성", "반성 열성", "상염색체 열성", "성염색체 우성"], ans: 2, exp: "상염색체 열성 유전으로, 열성 동형접합(tt)일 때 발현됩니다." },
          { q: "3. 영아형 테이 삭스병의 안과적 특징 소견은?", options: ["수정체 탈구", "망막 체리색 반점", "백내장", "황반변성"], ans: 1, exp: "망막 중심부에 체리색 반점(Cherry-red spot)이 관찰됩니다." },
          { q: "4. 보균자(Tt) 부모 사이에서 자녀 발병 확률은?", options: ["0%", "25%", "50%", "75%"], ans: 1, exp: "보균자 부모 임신 시 자녀 발병(tt) 확률은 25%입니다." },
          { q: "5. 테이 삭스병의 현재 치료 방향은?", options: ["단번에 완전 완치", "완치제가 없어 보존적(증상 완화) 치료 시행", "약물로 효소 완전 복구", "치료 불필요"], ans: 1, exp: "완치법이 없으므로 항경련제, 물리치료 등 지원적 관리를 시행합니다." }
        ]
      },
      marfan: {
        title: "마르판 증후군 (Marfan Syndrome)",
        cause: {
          kw: "15번 염색체 FBN1 유전자 변이 / 피브릴린-1 단백질 이상",
          desc: "15번 염색체(15q21.1)의 FBN1 유전자 변이로 인해 결합조직을 구성하는 주요 단백질인 피브릴린-1(fibrillin-1)이 정상적으로 생성되지 않습니다. 이로 인해 전신의 결합조직 탄성력이 떨어지고 세포 성장 인자(TGF-beta)의 조절 장애가 발생합니다."
        },
        inheritance: {
          kw: "상염색체 우성 유전 (Autosomal Dominant) / de novo 변이",
          desc: "상염색체 우성 유전 질환으로 변이 유전자를 1개만 물려받아도 발병합니다.\n• 환자의 자녀는 50%의 확률로 질환을 물려받습니다.\n• 약 75%는 부모로부터 유전되며, 약 25%는 부모에게 이상이 없는 신규 돌연변이(de novo)로 발생합니다."
        },
        symptoms: {
          kw: "대동맥 근부 확장 / 수정체 탈구 / 긴 팔다리와 손가락",
          desc: "• 심혈관계: 대동맥 벽이 약해져 대동맥 근부가 확장되거나 대동맥류, 대동맥 박리 등 생명을 위협하는 합병증이 발생할 수 있습니다.\n• 눈: 수정체를 지지하는 섬유가 약해져 수정체가 위쪽으로 이동하는 '수정체 탈구(Ectopia lentis)' 및 심한 근시가 발생합니다.\n• 골격계: 키가 크고 팔다리와 손가락이 몸통에 비해 매우 길며, 척추측만증과 오목가슴/새가슴 변형이 관찰됩니다."
        },
        diagnosis: {
          kw: "Ghent 진단 기준 / 심초음파 / FBN1 유전자 검사",
          desc: "• 임상 평가: Ghent 진단 기준에 따라 대동맥 확장, 수정체 탈구, 골격계 점수, 가족력을 종합 판단합니다.\n• 심초음파: 대동맥 뿌리의 직경 측정 및 판막 역류 여부를 확인합니다.\n• 분자유전학 검사: FBN1 유전자 변이 타겟 분석 검사를 시행합니다."
        },
        management: {
          kw: "베타차단제 약물 치료 / 예방적 대동맥 수술 / 정기 추적",
          desc: "• 약물 치료: 혈압과 심장 박동수를 낮추어 대동맥에 가해지는 압력을 줄이기 위해 베타차단제나 ARB 계열 약물을 복용합니다.\n• 수술적 치료: 대동맥 직경이 일정 수준 이상 확장되면 인공 혈관으로 교체하는 예방적 수술을 진행합니다."
        },
        sources: [
          { name: "서울대학교병원 의학정보 - 마르판 증후군", url: "http://www.snuh.org" },
          { name: "The Marfan Foundation - Medical & Health Information", url: "https://marfan.org" },
          { name: "GeneReviews® - Marfan Syndrome (Dietz H, 2021)", url: "https://www.ncbi.nlm.nih.gov/books/NBK1335/" }
        ],
        quizzes: [
          { q: "1. 마르판 증후군과 직접 관련된 유전자는?", options: ["CFTR", "FBN1", "HBB", "F8"], ans: 1, exp: "FBN1 유전자는 피브릴린-1 단백질을 합성하는 정보를 담고 있습니다." },
          { q: "2. 마르판 증후군의 유전 방식은?", options: ["상염색체 열성", "X염색체 우성", "상염색체 우성", "X염색체 열성"], ans: 2, exp: "상염색체 우성 방식으로 유전됩니다." },

    function renderTab(key, keyword = '') {
      currentTab = key;
      const mainDiv = document.getElementById('main-content');
      const quizSection = document.getElementById('quiz-section');

      if (key === 'compare') {
        quizSection.style.display = 'none';
        mainDiv.innerHTML = renderCompareTable();
        return;
      }

      quizSection.style.display = 'block';
      const data = diseases[key];

      const highlightText = (text, kw) => {
        if (!kw) return text;
        const re = new RegExp(kw, 'gi');
        return text.replace(re, match => `<span class="highlight">${match}</span>`);
      };

      const sections = [
        { title: "1. 유전적 원인", icon: "fa-dna", data: data.cause },
        { title: "2. 유전 방식", icon: "fa-sitemap", data: data.inheritance },
        { title: "3. 주요 증상 및 특징", icon: "fa-stethoscope", data: data.symptoms },
        { title: "4. 진단 방법", icon: "fa-microscope", data: data.diagnosis },
        { title: "5. 치료 및 관리 방법", icon: "fa-kit-medical", data: data.management }
      ];

      let gridCardsHTML = sections.map(sec => `
        <div class="card">
          <div class="card-title"><i class="fa-solid ${sec.icon}"></i> ${sec.title}</div>
          <div class="keyword-badge">${highlightText(sec.data.kw, keyword)}</div>
          <div class="card-content">${highlightText(sec.data.desc, keyword)}</div>
        </div>
      `).join('');

      let sourcesHTML = `
        <div class="source-card">
          <div class="source-title"><i class="fa-solid fa-book-bookmark"></i> [확인된 출처 및 참고 문헌 서지 정보]</div>
          <ul class="source-list">
            ${data.sources.map(s => `
              <li>
                <i class="fa-solid fa-link"></i>
                <span><strong>${s.name}</strong> - <a href="${s.url}" target="_blank" class="source-link">${s.url}</a></span>
              </li>
            `).join('')}
          </ul>
        </div>
      `;

      mainDiv.innerHTML = `
        <div class="card full-width" style="margin-bottom: 18px; border-left: 4px solid var(--accent-blue);">
          <div class="card-title"><i class="fa-solid fa-disease"></i> 탐구 대상 질환</div>
          <div class="card-content" style="font-weight:bold; font-size:1.2rem; color: var(--accent-blue);">${data.title}</div>
        </div>
        <div class="grid-container">
          ${gridCardsHTML}
          ${sourcesHTML}
        </div>
      `;

      // 퀴즈 렌더링
      const quizDiv = document.getElementById('quiz-container');
      quizDiv.innerHTML = data.quizzes.map((q, qIdx) => `
        <div class="quiz-item">
          <div class="quiz-q">${q.q}</div>
          ${q.options.map((opt, oIdx) => `
            <button class="quiz-btn" onclick="checkAnswer(${qIdx},${oIdx}, ${q.ans}, '${encodeURIComponent(q.exp)}')">
              ${oIdx + 1}.${opt}
            </button>
          `).join('')}
          <div id="q-res-${qIdx}" class="result-box"></div>
        </div>
      `).join('');
    }

    function switchTab(key, el) {

      renderTab(key, document.getElementById('searchInput').value.trim());
    }

    function handleSearch() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!query) {
        renderTab(currentTab);
        return;
      }
      if (currentTab === 'compare') {
        renderTab(currentTab);
        return;
      }
      renderTab(currentTab, query);
    }

    function checkAnswer(qIdx, selected, correct, exp) {
      const resBox = document.getElementById(`q-res-${qIdx}`);
      const decodedExp = decodeURIComponent(exp);
      resBox.style.display = "block";

      if (selected === correct) {
        resBox.style.background = "rgba(34, 197, 94, 0.2)";
        resBox.style.color = "#4ade80";
        resBox.style.border = "1px solid rgba(34, 197, 94, 0.4)";
        resBox.innerHTML = `⭕ 정답입니다!<br><span style="font-weight:normal; font-size:0.82rem; color:#cbd5e1;">💡 해설: ${decodedExp}</span>`;
      } else {
        resBox.style.background = "rgba(239, 68, 68, 0.2)";
        resBox.style.color = "#f87171";
        resBox.style.border = "1px solid rgba(239, 68, 68, 0.4)";
        resBox.innerText = "❌ 오답입니다. 다시 시도해보세요!";
      }
    }

    // 초기 실행
    renderTab('taysachs');
  </script>
</body>
</html>
